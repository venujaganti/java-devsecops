name: Java DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-test:

    name: Build and Test

    runs-on: ubuntu-24.04

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Verify Java
      - name: Check Java version
        run: java -version


      # 4. Run tests
      - name: Run Maven tests
        run: mvn clean test


      # 5. Build JAR
      - name: Build application
        run: mvn package -DskipTests


      # 6. Upload JAR
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar


  security-scan:

    name: Security Scan

    runs-on: ubuntu-24.04

    needs: build-test

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Trivy filesystem scan
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: 'path/to/skip'  # if applicable


  docker-build:

    name: Docker Build and Scan

    runs-on: ubuntu-24.04

    needs:
      - build-test
      - security-scan

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Build JAR
      - name: Build JAR
        run: mvn package -DskipTests


      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t java-devsecops:${{ github.sha }} \
            .


      # 5. Check Docker image
      - name: Show Docker images
        run: docker images


      # 6. Scan Docker image with Trivy
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'java-devsecops:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'