apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-devsecops
  namespace: devsecops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-devsecops

  template:
    metadata:
      labels:
        app: java-devsecops

    spec:
      containers:

        - name: java-devsecops

          image: java-devsecops:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 10